{% extends "layout.html" %}
{% block title %}Ассистент - MartFi{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/assistant.css">
{% endblock %}
{% block content %}
<div class="assistant-container">
    <div class="assistant-header">
        <h1>Финансовый ассистент</h1>
        <p class="assistant-description">
            Задайте любой вопрос об инвестициях, акциях, облигациях или фондах.
        </p>
    </div>
    <div class="chat-main-window">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea class="chat-input" id="messageInput" placeholder="Введите ваш вопрос..." rows="1"></textarea>
                <button class="chat-send-btn" id="sendButton" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
            <div class="chat-controls">
                <button class="reporting-mode-btn" id="reportingModeBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M3 3V21H21" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M7 14L11 9L15 13L21 7" stroke="currentColor" stroke-width="2" fill="none"/>
                    </svg>
                    <span>Режим отчетности</span>
                </button>
                <button class="clear-history-btn" id="clearHistory">Очистить историю</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="/static/js/markdown-parser.js"></script>
<script src="/static/js/assistant.js"></script>
{% endblock %}
